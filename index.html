<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 태그 & 반복 에디터</title>
    <!-- 사이트 탭 아이콘 & 모바일 홈 화면 앱 아이콘 (icon.jpg.png 연결) -->
    <link rel="icon" type="image/png" href="icon.jpg.png">
    <link rel="shortcut icon" type="image/png" href="icon.jpg.png">
    <link rel="apple-touch-icon" href="icon.jpg.png">
    <meta name="theme-color" content="#121212">

    <!-- ID3 태그 읽기 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <!-- ID3 태그 쓰기 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    <!-- M4A -> MP3 변환 인코더 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <!-- 전체 ZIP 묶음 다운로드 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .cover-box {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-placeholder {
            font-size: 48px;
            color: #555;
        }
        .file-label {
            display: inline-block;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .file-label:hover {
            background-color: #1ed760;
        }
        input[type="file"] {
            display: none;
        }
        .queue-box {
            display: none;
            background-color: #252525;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .queue-header {
            font-size: 0.8em;
            color: #1db954;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .queue-list {
            max-height: 170px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2f2f2f;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.82em;
            cursor: pointer;
            border: 1px solid transparent;
            gap: 6px;
        }
        .queue-item.selected {
            border-color: #1db954;
            background-color: #353b37;
        }
        .queue-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .queue-item-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .queue-item-status {
            font-size: 0.85em;
            color: #aaa;
        }
        .mini-dl-btn {
            background-color: #1db954;
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
        }
        .mini-dl-btn:hover {
            background-color: #1ed760;
        }
        .mini-dl-btn.saved {
            background-color: #444;
            color: #1db954;
        }
        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .input-group label {
            font-size: 0.8em;
            color: #b3b3b3;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            font-size: 0.9em;
        }
        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .toggle-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-btn.active {
            background-color: #1db954;
            color: #000;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.2s;
        }
        .btn-search {
            background-color: #333;
            color: #fff;
        }
        .btn-search:hover {
            background-color: #444;
        }
        .btn-download {
            background-color: #1db954;
            color: #000;
        }
        .btn-download:hover {
            background-color: #1ed760;
        }
        .btn-zip {
            display: none;
            width: 100%;
            margin-top: 8px;
            background-color: #2b5876;
            color: #fff;
        }
        .btn-zip:hover {
            background-color: #366d91;
        }
        .btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        #status-msg {
            font-size: 0.8em;
            color: #1db954;
            margin-top: 10px;
            min-height: 18px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>🎵 MP3 태그 & 반복 에디터</h2>

        <label class="file-label" for="audio-file">
            📂 음악 파일 선택하기 (여러 곡 가능)
        </label>
        <input type="file" id="audio-file" accept="audio/*" multiple>

        <div class="queue-box" id="queue-box">
            <div class="queue-header">
                <span id="queue-count-text">선택된 곡 목록 (0곡)</span>
                <span style="color:#aaa; font-weight:normal;">완료 후 개별 저장 가능</span>
            </div>
            <div class="queue-list" id="queue-list"></div>
        </div>

        <div class="cover-box">
            <span class="cover-placeholder" id="placeholder">🎵</span>
            <img id="cover-img" src="" alt="Album Cover" style="display: none;">
        </div>

        <div class="input-group">
            <label>곡 제목 (Title)</label>
            <input type="text" id="title-input" placeholder="노래 제목 입력">
        </div>
        <div class="input-group">
            <label>아티스트 (Artist)</label>
            <input type="text" id="artist-input" placeholder="가수 이름 입력">
        </div>
        <div class="input-group">
            <label>작곡가 / 프로듀서 (Composer)</label>
            <input type="text" id="composer-input" placeholder="작곡가 이름 입력">
        </div>

        <div class="option-row">
            <span>🔁 무한 반복 재생 (웹용)</span>
            <button class="toggle-btn" id="loop-toggle-btn">OFF</button>
        </div>

        <div class="input-group">
            <label>🔁 음원 반복해서 저장하기 (전체 곡 일괄 적용)</label>
            <select id="repeat-count-select">
                <option value="1">1회 (원본 길이)</option>
                <option value="2">2회 반복 연결</option>
                <option value="3">3회 반복 연결</option>
                <option value="4">4회 반복 연결</option>
                <option value="5">5회 반복 연결</option>
                <option value="6">6회 반복 연결</option>
                <option value="7">7회 반복 연결</option>
                <option value="8">8회 반복 연결</option>
                <option value="9">9회 반복 연결</option>
                <option value="10">10회 반복 연결</option>
                <option value="12">12회 반복 연결</option>
                <option value="15">15회 반복 연결</option>
                <option value="18">18회 반복 연결</option>
                <option value="20">20회 반복 연결 (최대)</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn btn-search" id="search-btn">🔍 정보 자동 검색</button>
            <button class="btn btn-download" id="download-btn" disabled>💾 태그 입혀서 저장</button>
        </div>

        <!-- 여러 곡 완료 시 한 번에 받을 수 있는 ZIP 버튼 -->
        <button class="btn btn-zip" id="zip-download-btn">🗜️ 전체 ZIP 파일로 한 번에 받기</button>

        <div id="status-msg"></div>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        (function setupManifest() {
            const iconUrl = new URL('icon.jpg.png', window.location.href).href;
            const manifest = {
                name: 'MP3 태그 & 반복 에디터',
                short_name: 'MP3 에디터',
                start_url: window.location.href,
                display: 'standalone',
                background_color: '#121212',
                theme_color: '#121212',
                icons: [
                    { src: iconUrl, sizes: '192x192', type: 'image/png' },
                    { src: iconUrl, sizes: '512x512', type: 'image/png' }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        })();

        let fileQueue = [];
        let activeIndex = -1;
        let isProcessing = false;

        const fileInput = document.getElementById('audio-file');
        const queueBox = document.getElementById('queue-box');
        const queueCountText = document.getElementById('queue-count-text');
        const queueList = document.getElementById('queue-list');
        const audioPlayer = document.getElementById('audio-player');
        const titleInput = document.getElementById('title-input');
        const artistInput = document.getElementById('artist-input');
        const composerInput = document.getElementById('composer-input');
        const coverImg = document.getElementById('cover-img');
        const placeholder = document.getElementById('placeholder');
        const searchBtn = document.getElementById('search-btn');
        const downloadBtn = document.getElementById('download-btn');
        const zipDownloadBtn = document.getElementById('zip-download-btn');
        const statusMsg = document.getElementById('status-msg');
        const loopToggleBtn = document.getElementById('loop-toggle-btn');
        const repeatCountSelect = document.getElementById('repeat-count-select');

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function sanitizeFileName(name) {
            return (name || 'music').replace(/[\\/:*?"<>|]/g, '_').trim() || 'music';
        }

        function triggerBrowserDownload(url, fileName) {
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        loopToggleBtn.addEventListener('click', () => {
            audioPlayer.loop = !audioPlayer.loop;
            if (audioPlayer.loop) {
                loopToggleBtn.innerText = 'ON';
                loopToggleBtn.classList.add('active');
            } else {
                loopToggleBtn.innerText = 'OFF';
                loopToggleBtn.classList.remove('active');
            }
        });

        function isMp4(buffer) {
            const bytes = new Uint8Array(buffer);
            if (bytes.length > 8) {
                if (bytes[4] === 0x66 && bytes[5] === 0x74 && bytes[6] === 0x79 && bytes[7] === 0x70) {
                    return true;
                }
            }
            return false;
        }

        function readFileTags(file) {
            return new Promise((resolve) => {
                const defaultTitle = file.name.replace(/\.[^/.]+$/, "");
                const item = {
                    file: file,
                    title: defaultTitle,
                    artist: '',
                    composer: '',
                    coverBuffer: null,
                    coverMimeType: 'image/jpeg',
                    coverPreviewUrl: '',
                    status: '대기',
                    resultBlob: null,
                    downloadUrl: '',
                    outputFileName: '',
                    manuallySaved: false
                };

                window.jsmediatags.read(file, {
                    onSuccess: function(tag) {
                        const tags = tag.tags;
                        if (tags.title) item.title = tags.title;
                        if (tags.artist) item.artist = tags.artist;
                        if (tags.composer) item.composer = tags.composer;

                        if (tags.picture) {
                            const { data, format } = tags.picture;
                            const byteArray = new Uint8Array(data);
                            item.coverBuffer = byteArray.buffer;
                            item.coverMimeType = format || 'image/jpeg';
                            const blob = new Blob([byteArray], { type: item.coverMimeType });
                            item.coverPreviewUrl = URL.createObjectURL(blob);
                        }
                        resolve(item);
                    },
                    onError: function() {
                        resolve(item);
                    }
                });
            });
        }

        function selectQueueItem(index) {
            if (index < 0 || index >= fileQueue.length) return;
            activeIndex = index;
            const item = fileQueue[index];

            titleInput.value = item.title;
            artistInput.value = item.artist;
            composerInput.value = item.composer;

            if (item.coverPreviewUrl) {
                coverImg.src = item.coverPreviewUrl;
                coverImg.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                coverImg.src = '';
                coverImg.style.display = 'none';
                placeholder.style.display = 'block';
            }

            if (audioPlayer.src) URL.revokeObjectURL(audioPlayer.src);
            audioPlayer.src = URL.createObjectURL(item.file);

            renderQueueList();
        }

        function renderQueueList() {
            if (fileQueue.length <= 1) {
                queueBox.style.display = 'none';
                downloadBtn.innerText = '💾 태그 입혀서 저장';
                zipDownloadBtn.style.display = 'none';
                return;
            }

            queueBox.style.display = 'block';
            queueCountText.innerText = `선택된 곡 목록 (${fileQueue.length}곡)`;
            downloadBtn.innerText = `💾 전체 변환·반복 시작 (${fileQueue.length}곡)`;

            const completedItems = fileQueue.filter(item => item.resultBlob);
            if (completedItems.length >= 2 && !isProcessing) {
                zipDownloadBtn.style.display = 'block';
                zipDownloadBtn.innerText = `🗜️ 전체 ZIP 파일로 한 번에 받기 (${completedItems.length}곡)`;
            } else {
                zipDownloadBtn.style.display = 'none';
            }

            queueList.innerHTML = '';
            fileQueue.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'queue-item' + (idx === activeIndex ? ' selected' : '');

                const titleSpan = document.createElement('span');
                titleSpan.className = 'queue-item-title';
                titleSpan.textContent = `${idx + 1}. ${item.title}`;

                const rightDiv = document.createElement('div');
                rightDiv.className = 'queue-item-right';

                const statusSpan = document.createElement('span');
                statusSpan.className = 'queue-item-status';
                statusSpan.textContent = item.status;
                rightDiv.appendChild(statusSpan);

                // 변환 완료된 곡은 브라우저 차단 없이 언제든 직접 눌러 받을 수 있는 개별 버튼 제공
                if (item.downloadUrl) {
                    const dlBtn = document.createElement('button');
                    dlBtn.type = 'button';
                    dlBtn.className = 'mini-dl-btn' + (item.manuallySaved ? ' saved' : '');
                    dlBtn.textContent = item.manuallySaved ? '📥 다시받기' : '📥 저장';
                    dlBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        triggerBrowserDownload(item.downloadUrl, item.outputFileName);
                        item.manuallySaved = true;
                        dlBtn.className = 'mini-dl-btn saved';
                        dlBtn.textContent = '📥 다시받기';
                    });
                    rightDiv.appendChild(dlBtn);
                }

                row.appendChild(titleSpan);
                row.appendChild(rightDiv);

                row.addEventListener('click', () => {
                    if (!isProcessing) selectQueueItem(idx);
                });
                queueList.appendChild(row);
            });
        }

        titleInput.addEventListener('input', () => {
            if (activeIndex >= 0 && fileQueue[activeIndex]) {
                fileQueue[activeIndex].title = titleInput.value;
                renderQueueList();
            }
        });
        artistInput.addEventListener('input', () => {
            if (activeIndex >= 0 && fileQueue[activeIndex]) {
                fileQueue[activeIndex].artist = artistInput.value;
            }
        });
        composerInput.addEventListener('input', () => {
            if (activeIndex >= 0 && fileQueue[activeIndex]) {
                fileQueue[activeIndex].composer = composerInput.value;
            }
        });

        fileInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            fileQueue.forEach(item => {
                if (item.coverPreviewUrl) URL.revokeObjectURL(item.coverPreviewUrl);
                if (item.downloadUrl) URL.revokeObjectURL(item.downloadUrl);
            });

            statusMsg.innerText = `${files.length}곡의 커버 및 태그 정보를 불러오는 중...`;
            downloadBtn.disabled = true;
            zipDownloadBtn.style.display = 'none';

            fileQueue = [];
            for (const file of files) {
                const item = await readFileTags(file);
                fileQueue.push(item);
            }

            selectQueueItem(0);
            downloadBtn.disabled = false;

            if (fileQueue.length === 1) {
                statusMsg.innerText = fileQueue[0].coverBuffer
                    ? "✅ 기존 커버 및 태그 정보를 불러왔습니다!"
                    : "기존 커버가 없어 검색 버튼으로 찾으실 수 있습니다.";
            } else {
                statusMsg.innerText = `✅ 총 ${fileQueue.length}곡 준비 완료! 곡별 기존 커버가 유지됩니다.`;
            }
        });

        searchBtn.addEventListener('click', () => {
            const query = titleInput.value.trim();
            if (query && activeIndex >= 0) fetchMetadata(query, activeIndex);
        });

        async function fetchMetadata(query, targetIdx) {
            statusMsg.innerText = "음악 정보를 온라인 검색 중입니다...";
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const info = data.results[0];
                    const item = fileQueue[targetIdx];
                    item.title = info.trackName || item.title;
                    item.artist = info.artistName || '';
                    item.composer = info.artistName || '';

                    if (info.artworkUrl100) {
                        const highResUrl = info.artworkUrl100.replace('100x100bb', '600x600bb');
                        const imgRes = await fetch(highResUrl);
                        item.coverBuffer = await imgRes.arrayBuffer();
                        item.coverMimeType = imgRes.headers.get('content-type') || 'image/jpeg';
                        if (item.coverPreviewUrl) URL.revokeObjectURL(item.coverPreviewUrl);
                        item.coverPreviewUrl = highResUrl;
                    }

                    if (activeIndex === targetIdx) {
                        selectQueueItem(targetIdx);
                    }
                    statusMsg.innerText = "✅ 온라인 음악 정보 및 새 커버를 가져왔습니다!";
                } else {
                    statusMsg.innerText = "검색 결과를 찾지 못했습니다. 기존 커버가 유지됩니다.";
                }
            } catch (err) {
                statusMsg.innerText = "정보 검색 중 오류가 발생했습니다.";
            }
        }

        function extractPureAudio(buffer) {
            let bytes = new Uint8Array(buffer);
            let start = 0;
            let end = bytes.length;

            if (bytes.length > 10 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) {
                const flags = bytes[5];
                const hasFooter = (flags & 0x10) !== 0;
                const size = ((bytes[6] & 0x7F) << 21) | ((bytes[7] & 0x7F) << 14) | ((bytes[8] & 0x7F) << 7) | (bytes[9] & 0x7F);
                start = 10 + size + (hasFooter ? 10 : 0);
            }

            if (end - start > 128) {
                if (bytes[end - 128] === 0x54 && bytes[end - 127] === 0x41 && bytes[end - 126] === 0x47) {
                    end -= 128;
                }
            }

            if (end - start > 32) {
                if (bytes[end - 32] === 0x41 && bytes[end - 31] === 0x50 && bytes[end - 30] === 0x45 && bytes[end - 29] === 0x54) {
                    end -= 32;
                }
            }

            return buffer.slice(start, end);
        }

        function audioBufferToMp3(audioBuffer) {
            const channels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
            const mp3Data = [];

            const left = audioBuffer.getChannelData(0);
            const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

            const sampleBlockSize = 1152;
            const leftChunk = new Int16Array(sampleBlockSize);
            const rightChunk = new Int16Array(sampleBlockSize);

            for (let i = 0; i < left.length; i += sampleBlockSize) {
                const subLen = Math.min(sampleBlockSize, left.length - i);
                for (let j = 0; j < subLen; j++) {
                    let sL = Math.max(-1, Math.min(1, left[i + j]));
                    leftChunk[j] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;

                    let sR = Math.max(-1, Math.min(1, right[i + j]));
                    rightChunk[j] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
                }
                
                let mp3buf;
                if (channels === 1) {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk.subarray(0, subLen));
                } else {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk.subarray(0, subLen), rightChunk.subarray(0, subLen));
                }
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);

            let totalLen = 0;
            for (let i = 0; i < mp3Data.length; i++) {
                totalLen += mp3Data[i].length;
            }
            const merged = new Uint8Array(totalLen);
            let offset = 0;
            for (let i = 0; i < mp3Data.length; i++) {
                merged.set(mp3Data[i], offset);
                offset += mp3Data[i].length;
            }
            return merged.buffer;
        }

        async function processSingleItem(item, repeatCount, index, total, usedNames) {
            // 이전 작업 결과가 있다면 정리
            if (item.downloadUrl) {
                URL.revokeObjectURL(item.downloadUrl);
                item.downloadUrl = '';
            }
            item.resultBlob = null;
            item.manuallySaved = false;

            let rawBuffer = await item.file.arrayBuffer();
            let baseAudioBuffer;

            if (isMp4(rawBuffer)) {
                statusMsg.innerText = `[${index + 1}/${total}] "${item.title}" M4A → MP3 변환 중...`;
                await sleep(50);
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const decodedBuffer = await audioCtx.decodeAudioData(rawBuffer.slice(0));
                baseAudioBuffer = audioBufferToMp3(decodedBuffer);
                await audioCtx.close();
            } else {
                baseAudioBuffer = extractPureAudio(rawBuffer);
            }
            rawBuffer = null;

            statusMsg.innerText = `[${index + 1}/${total}] "${item.title}" ${repeatCount}회 반복 및 태그 생성 중...`;
            await sleep(50);

            const sourceArray = new Uint8Array(baseAudioBuffer);
            const finalArray = new Uint8Array(baseAudioBuffer.byteLength * repeatCount);
            for (let i = 0; i < repeatCount; i++) {
                finalArray.set(sourceArray, i * baseAudioBuffer.byteLength);
            }
            baseAudioBuffer = null;

            const writer = new ID3Writer(finalArray.buffer);
            const cleanTitle = (item.title || '').trim();
            const cleanArtist = (item.artist || '').trim();
            const cleanComposer = (item.composer || '').trim();

            if (cleanTitle) writer.setFrame('TIT2', cleanTitle);
            if (cleanArtist) writer.setFrame('TPE1', [cleanArtist]);
            if (cleanComposer) writer.setFrame('TCOM', [cleanComposer]);

            if (item.coverBuffer) {
                writer.setFrame('APIC', {
                    type: 3,
                    data: item.coverBuffer,
                    description: 'Cover',
                    mime: item.coverMimeType
                });
            }

            writer.addTag();

            // 중복 파일명 방지 처리
            const baseFileName = sanitizeFileName(cleanTitle);
            let finalFileName = `${baseFileName}.mp3`;
            let counter = 2;
            while (usedNames.has(finalFileName.toLowerCase())) {
                finalFileName = `${baseFileName} (${counter}).mp3`;
                counter++;
            }
            usedNames.add(finalFileName.toLowerCase());

            const blob = writer.getBlob();
            const downloadUrl = URL.createObjectURL(blob);

            item.resultBlob = blob;
            item.downloadUrl = downloadUrl;
            item.outputFileName = finalFileName;

            // 자동 다운로드 시도
            triggerBrowserDownload(downloadUrl, finalFileName);
            if (index === 0) {
                item.manuallySaved = true;
            }
        }

        downloadBtn.addEventListener('click', async () => {
            if (!fileQueue.length || isProcessing) return;

            isProcessing = true;
            downloadBtn.disabled = true;
            searchBtn.disabled = true;
            fileInput.disabled = true;
            zipDownloadBtn.style.display = 'none';

            const repeatCount = parseInt(repeatCountSelect.value, 10);
            const total = fileQueue.length;
            const usedNames = new Set();
            let successCount = 0;

            for (let i = 0; i < total; i++) {
                const item = fileQueue[i];
                item.status = '⏳ 처리중';
                renderQueueList();

                try {
                    await processSingleItem(item, repeatCount, i, total, usedNames);
                    item.status = '✅ 완료';
                    successCount++;
                } catch (err) {
                    console.error(err);
                    item.status = '❌ 실패';
                }
                renderQueueList();

                // 브라우저가 연속 다운로드를 처리할 수 있도록 1.5초 간격 유지
                if (i < total - 1) {
                    await sleep(1500);
                }
            }

            isProcessing = false;
            downloadBtn.disabled = false;
            searchBtn.disabled = false;
            fileInput.disabled = false;
            renderQueueList();

            if (total === 1 && successCount === 1) {
                statusMsg.innerText = "🎉 다운로드가 완료되었습니다!";
            } else {
                statusMsg.innerText = `🎉 총 ${total}곡 중 ${successCount}곡 작업 완료!\n모바일에서 자동 다운이 막힌 곡은 위 목록의 [📥 저장] 또는 아래 [ZIP 받기]를 눌러주세요.`;
            }
        });

        // 전체 완료된 곡을 하나의 ZIP 파일로 묶어서 다운로드
        zipDownloadBtn.addEventListener('click', async () => {
            const completedItems = fileQueue.filter(item => item.resultBlob);
            if (!completedItems.length || isProcessing) return;

            zipDownloadBtn.disabled = true;
            statusMsg.innerText = `📦 ${completedItems.length}곡을 하나의 ZIP 파일로 묶는 중...`;

            try {
                const zip = new JSZip();
                completedItems.forEach(item => {
                    zip.file(item.outputFileName, item.resultBlob);
                });

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const zipUrl = URL.createObjectURL(zipBlob);
                triggerBrowserDownload(zipUrl, `반복음원_${completedItems.length}곡.zip`);

                statusMsg.innerText = "🎉 ZIP 파일 다운로드가 시작되었습니다! (내 파일 앱에서 압축 풀기)";
            } catch (err) {
                console.error(err);
                alert("ZIP 파일 생성 중 오류가 발생했습니다.");
                statusMsg.innerText = "ZIP 파일 생성 실패";
            } finally {
                zipDownloadBtn.disabled = false;
            }
        });
    </script>
