<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 태그 & 반복 에디터</title>
    <!-- 사이트 탭 아이콘 & 모바일 홈 화면 앱 아이콘 (icon.jpg.png 유지) -->
    <link rel="icon" type="image/png" href="icon.jpg.png">
    <link rel="shortcut icon" type="image/png" href="icon.jpg.png">
    <link rel="apple-touch-icon" href="icon.jpg.png">
    <meta name="theme-color" content="#121212">

    <!-- ID3 태그 읽기 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <!-- ID3 태그 쓰기 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    <!-- M4A -> MP3 변환 인코더 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <!-- 분할 ZIP 묶음 다운로드 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
        }
        .cover-box {
            width: 160px;
            height: 160px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-placeholder {
            font-size: 44px;
            color: #555;
        }
        .file-label {
            display: inline-block;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .file-label:hover {
            background-color: #1ed760;
        }
        input[type="file"] {
            display: none;
        }
        .queue-box {
            display: none;
            background-color: #252525;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .queue-header {
            font-size: 0.8em;
            color: #1db954;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .queue-list {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2f2f2f;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8em;
            cursor: pointer;
            border: 1px solid transparent;
            gap: 6px;
        }
        .queue-item.selected {
            border-color: #1db954;
            background-color: #353b37;
        }
        .queue-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .queue-item-status {
            font-size: 0.85em;
            color: #aaa;
            flex-shrink: 0;
        }
        .input-group {
            text-align: left;
            margin-bottom: 11px;
        }
        .input-group label {
            font-size: 0.8em;
            color: #b3b3b3;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            font-size: 0.9em;
        }
        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 0.9em;
        }
        .toggle-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-btn.active {
            background-color: #1db954;
            color: #000;
        }
        .progress-container {
            display: none;
            margin-top: 12px;
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 10px;
            text-align: left;
        }
        .progress-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #ccc;
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #3a3a3a;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #1db954;
            transition: width 0.2s ease;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.2s;
        }
        .btn-search {
            background-color: #333;
            color: #fff;
        }
        .btn-search:hover {
            background-color: #444;
        }
        .btn-download {
            background-color: #1db954;
            color: #000;
        }
        .btn-download:hover {
            background-color: #1ed760;
        }
        .btn-stop {
            display: none;
            width: 100%;
            margin-top: 8px;
            background-color: #d9534f;
            color: #fff;
        }
        .btn-retry {
            display: none;
            width: 100%;
            margin-top: 8px;
            background-color: #e67e22;
            color: #fff;
        }
        .btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        audio {
            width: 100%;
            margin-top: 14px;
        }
        #status-msg {
            font-size: 0.8em;
            color: #1db954;
            margin-top: 10px;
            min-height: 18px;
            line-height: 1.45;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>🎵 MP3 태그 & 반복 에디터</h2>

        <label class="file-label" for="audio-file">
            📂 음악 파일 선택하기 (200곡 이상 가능)
        </label>
        <input type="file" id="audio-file" accept="audio/*" multiple>

        <div class="queue-box" id="queue-box">
            <div class="queue-header">
                <span id="queue-count-text">선택된 곡 목록 (0곡)</span>
                <span style="color:#aaa; font-weight:normal;">메모리 자동 절약 모드</span>
            </div>
            <div class="queue-list" id="queue-list"></div>
        </div>

        <div class="cover-box">
            <span class="cover-placeholder" id="placeholder">🎵</span>
            <img id="cover-img" src="" alt="Album Cover" style="display: none;">
        </div>

        <div class="input-group">
            <label>곡 제목 (Title)</label>
            <input type="text" id="title-input" placeholder="노래 제목 입력">
        </div>
        <div class="input-group">
            <label>아티스트 (Artist)</label>
            <input type="text" id="artist-input" placeholder="가수 이름 입력">
        </div>
        <div class="input-group">
            <label>작곡가 / 프로듀서 (Composer)</label>
            <input type="text" id="composer-input" placeholder="작곡가 이름 입력">
        </div>

        <div class="option-row">
            <span>🔁 무한 반복 재생 (웹용)</span>
            <button class="toggle-btn" id="loop-toggle-btn">OFF</button>
        </div>

        <div class="input-group">
            <label>🔁 음원 반복 횟수 (전체 일괄 적용)</label>
            <select id="repeat-count-select">
                <option value="1">1회 (원본 길이)</option>
                <option value="2">2회 반복 연결</option>
                <option value="3">3회 반복 연결</option>
                <option value="4">4회 반복 연결</option>
                <option value="5">5회 반복 연결</option>
                <option value="6">6회 반복 연결</option>
                <option value="7">7회 반복 연결</option>
                <option value="8">8회 반복 연결</option>
                <option value="9">9회 반복 연결</option>
                <option value="10">10회 반복 연결</option>
                <option value="12">12회 반복 연결</option>
                <option value="15">15회 반복 연결</option>
                <option value="18">18회 반복 연결</option>
                <option value="20">20회 반복 연결 (최대)</option>
            </select>
        </div>

        <div class="input-group" id="batch-mode-group" style="display: none;">
            <label>📦 대량 저장 방식 (200곡 안정화 설정)</label>
            <select id="batch-mode-select">
                <option value="zip20">📦 20곡씩 자동 분할 ZIP 저장 (200곡 추천)</option>
                <option value="zip10">📦 10곡씩 자동 분할 ZIP 저장 (초저사양/고반복용)</option>
                <option value="single">📄 1곡씩 즉시 저장 후 메모리 비우기</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn btn-search" id="search-btn">🔍 정보 자동 검색</button>
            <button class="btn btn-download" id="download-btn" disabled>💾 태그 입혀서 저장</button>
        </div>

        <button class="btn btn-stop" id="stop-btn">⏹️ 작업 안전 중단하기</button>
        <button class="btn btn-retry" id="retry-btn">🔄 실패한 곡만 다시 실행</button>

        <div class="progress-container" id="progress-container">
            <div class="progress-top">
                <span id="progress-label">진행률: 0 / 0곡</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
        </div>

        <div id="status-msg"></div>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        (function setupManifest() {
            const iconUrl = new URL('icon.jpg.png', window.location.href).href;
            const manifest = {
                name: 'MP3 태그 & 반복 에디터',
                short_name: 'MP3 에디터',
                start_url: window.location.href,
                display: 'standalone',
                background_color: '#121212',
                theme_color: '#121212',
                icons: [
                    { src: iconUrl, sizes: '192x192', type: 'image/png' },
                    { src: iconUrl, sizes: '512x512', type: 'image/png' }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        })();

        let fileQueue = [];
        let activeIndex = -1;
        let isProcessing = false;
        let stopRequested = false;
        let wakeLock = null;
        let currentPreviewCoverUrl = '';

        const fileInput = document.getElementById('audio-file');
        const queueBox = document.getElementById('queue-box');
        const queueCountText = document.getElementById('queue-count-text');
        const queueList = document.getElementById('queue-list');
        const audioPlayer = document.getElementById('audio-player');
        const titleInput = document.getElementById('title-input');
        const artistInput = document.getElementById('artist-input');
        const composerInput = document.getElementById('composer-input');
        const coverImg = document.getElementById('cover-img');
        const placeholder = document.getElementById('placeholder');
        const searchBtn = document.getElementById('search-btn');
        const downloadBtn = document.getElementById('download-btn');
        const stopBtn = document.getElementById('stop-btn');
        const retryBtn = document.getElementById('retry-btn');
        const batchModeGroup = document.getElementById('batch-mode-group');
        const batchModeSelect = document.getElementById('batch-mode-select');
        const progressContainer = document.getElementById('progress-container');
        const progressLabel = document.getElementById('progress-label');
        const progressPercent = document.getElementById('progress-percent');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const statusMsg = document.getElementById('status-msg');
        const loopToggleBtn = document.getElementById('loop-toggle-btn');
        const repeatCountSelect = document.getElementById('repeat-count-select');

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function requestScreenWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                // 미지원 브라우저 무시
            }
        }

        async function releaseScreenWakeLock() {
            try {
                if (wakeLock) {
                    await wakeLock.release();
                    wakeLock = null;
                }
            } catch (err) {}
        }

        function sanitizeFileName(name) {
            return (name || 'music').replace(/[\\/:*?"<>|]/g, '_').trim() || 'music';
        }

        function triggerBrowserDownload(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            // 브라우저가 다운로드를 시작한 뒤 15초 후 메모리에서 URL 즉시 해제
            setTimeout(() => URL.revokeObjectURL(url), 15000);
        }

        loopToggleBtn.addEventListener('click', () => {
            audioPlayer.loop = !audioPlayer.loop;
            if (audioPlayer.loop) {
                loopToggleBtn.innerText = 'ON';
                loopToggleBtn.classList.add('active');
            } else {
                loopToggleBtn.innerText = 'OFF';
                loopToggleBtn.classList.remove('active');
            }
        });

        function isMp4(buffer) {
            const bytes = new Uint8Array(buffer);
            if (bytes.length > 8) {
                if (bytes[4] === 0x66 && bytes[5] === 0x74 && bytes[6] === 0x79 && bytes[7] === 0x70) {
                    return true;
                }
            }
            return false;
        }

        // 1곡의 태그와 커버를 필요할 때만 읽어오는 지연 로딩 함수 (메모리 절약 핵심)
        function readSingleFileMetadata(file) {
            return new Promise((resolve) => {
                window.jsmediatags.read(file, {
                    onSuccess: function(tag) {
                        const tags = tag.tags;
                        let coverBuffer = null;
                        let coverMimeType = 'image/jpeg';

                        if (tags.picture) {
                            const { data, format } = tags.picture;
                            coverBuffer = new Uint8Array(data).buffer;
                            coverMimeType = format || 'image/jpeg';
                        }

                        resolve({
                            title: tags.title || '',
                            artist: tags.artist || '',
                            composer: tags.composer || '',
                            coverBuffer,
                            coverMimeType
                        });
                    },
                    onError: function() {
                        resolve({
                            title: '',
                            artist: '',
                            composer: '',
                            coverBuffer: null,
                            coverMimeType: 'image/jpeg'
                        });
                    }
                });
            });
        }

        async function selectQueueItem(index) {
            if (index < 0 || index >= fileQueue.length) return;
            const prevIndex = activeIndex;
            activeIndex = index;
            const item = fileQueue[index];

            if (prevIndex >= 0) {
                const prevRow = document.getElementById(`q-row-${prevIndex}`);
                if (prevRow) prevRow.classList.remove('selected');
            }
            const curRow = document.getElementById(`q-row-${index}`);
            if (curRow) curRow.classList.add('selected');

            if (currentPreviewCoverUrl) {
                URL.revokeObjectURL(currentPreviewCoverUrl);
                currentPreviewCoverUrl = '';
            }

            // 처음 클릭하는 곡이면 그때 태그/커버를 읽음 (200곡 동시 로딩 방지)
            const meta = await readSingleFileMetadata(item.file);
            if (!item.edited) {
                if (meta.title) item.title = meta.title;
                if (meta.artist) item.artist = meta.artist;
                if (meta.composer) item.composer = meta.composer;
                const titleEl = document.getElementById(`q-title-${index}`);
                if (titleEl) titleEl.textContent = `${index + 1}. ${item.title}`;
            }

            titleInput.value = item.title;
            artistInput.value = item.artist;
            composerInput.value = item.composer;

            const activeCoverBuf = item.customCoverBuffer || meta.coverBuffer;
            const activeCoverMime = item.customCoverBuffer ? item.customCoverMime : meta.coverMimeType;

            if (activeCoverBuf) {
                const blob = new Blob([activeCoverBuf], { type: activeCoverMime });
                currentPreviewCoverUrl = URL.createObjectURL(blob);
                coverImg.src = currentPreviewCoverUrl;
                coverImg.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                coverImg.src = '';
                coverImg.style.display = 'none';
                placeholder.style.display = 'block';
            }

            if (audioPlayer.src) URL.revokeObjectURL(audioPlayer.src);
            audioPlayer.src = URL.createObjectURL(item.file);
        }

        function buildInitialQueueDOM() {
            if (fileQueue.length <= 1) {
                queueBox.style.display = 'none';
                batchModeGroup.style.display = 'none';
                downloadBtn.innerText = '💾 태그 입혀서 저장';
                return;
            }

            queueBox.style.display = 'block';
            batchModeGroup.style.display = 'block';
            queueCountText.innerText = `선택된 곡 목록 (${fileQueue.length}곡)`;
            downloadBtn.innerText = `💾 전체 일괄 시작 (${fileQueue.length}곡)`;

            const fragment = document.createDocumentFragment();
            fileQueue.forEach((item, idx) => {
                const row = document.createElement('div');
                row.id = `q-row-${idx}`;
                row.className = 'queue-item' + (idx === activeIndex ? ' selected' : '');

                const titleSpan = document.createElement('span');
                titleSpan.id = `q-title-${idx}`;
                titleSpan.className = 'queue-item-title';
                titleSpan.textContent = `${idx + 1}. ${item.title}`;

                const statusSpan = document.createElement('span');
                statusSpan.id = `q-status-${idx}`;
                statusSpan.className = 'queue-item-status';
                statusSpan.textContent = item.status;

                row.appendChild(titleSpan);
                row.appendChild(statusSpan);

                row.addEventListener('click', () => {
                    if (!isProcessing) selectQueueItem(idx);
                });
                fragment.appendChild(row);
            });

            queueList.innerHTML = '';
            queueList.appendChild(fragment);
        }

        function updateItemStatusUI(idx, newStatus, scrollIntoView = false) {
            fileQueue[idx].status = newStatus;
            const statusEl = document.getElementById(`q-status-${idx}`);
            if (statusEl) statusEl.textContent = newStatus;

            if (scrollIntoView) {
                const rowEl = document.getElementById(`q-row-${idx}`);
                if (rowEl) rowEl.scrollIntoView({ block: 'nearest' });
            }
        }

        function updateProgressUI(doneCount, totalCount) {
            const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
            progressLabel.textContent = `진행률: ${doneCount} / ${totalCount}곡`;
            progressPercent.textContent = `${pct}%`;
            progressBarFill.style.width = `${pct}%`;
        }

        titleInput.addEventListener('input', () => {
            if (activeIndex >= 0 && fileQueue[activeIndex]) {
                fileQueue[activeIndex].title = titleInput.value;
                fileQueue[activeIndex].edited = true;
                const titleEl = document.getElementById(`q-title-${activeIndex}`);
                if (titleEl) titleEl.textContent = `${activeIndex + 1}. ${titleInput.value}`;
            }
        });
        artistInput.addEventListener('input', () => {
            if (activeIndex >= 0 && fileQueue[activeIndex]) {
                fileQueue[activeIndex].artist = artistInput.value;
                fileQueue[activeIndex].edited = true;
            }
        });
        composerInput.addEventListener('input', () => {
            if (activeIndex >= 0 && fileQueue[activeIndex]) {
                fileQueue[activeIndex].composer = composerInput.value;
                fileQueue[activeIndex].edited = true;
            }
        });

        // 파일 다중 선택 (200곡도 0.1초 만에 즉시 목록화)
        fileInput.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            retryBtn.style.display = 'none';
            progressContainer.style.display = 'none';

            fileQueue = files.map((file) => ({
                file: file,
                title: file.name.replace(/\.[^/.]+$/, ""),
                artist: '',
                composer: '',
                edited: false,
                customCoverBuffer: null,
                customCoverMime: 'image/jpeg',
                status: '대기'
            }));

            activeIndex = 0;
            buildInitialQueueDOM();
            await selectQueueItem(0);
            downloadBtn.disabled = false;

            if (fileQueue.length === 1) {
                statusMsg.innerText = "✅ 파일을 불러왔습니다!";
            } else {
                statusMsg.innerText = `✅ 총 ${fileQueue.length}곡 대기열 준비 완료!\n곡별 기존 커버·태그는 작업 시 자동으로 추출되어 유지됩니다.`;
            }
        });

        searchBtn.addEventListener('click', () => {
            const query = titleInput.value.trim();
            if (query && activeIndex >= 0) fetchMetadata(query, activeIndex);
        });

        async function fetchMetadata(query, targetIdx) {
            statusMsg.innerText = "음악 정보를 온라인 검색 중입니다...";
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const info = data.results[0];
                    const item = fileQueue[targetIdx];
                    item.title = info.trackName || item.title;
                    item.artist = info.artistName || '';
                    item.composer = info.artistName || '';
                    item.edited = true;

                    if (info.artworkUrl100) {
                        const highResUrl = info.artworkUrl100.replace('100x100bb', '600x600bb');
                        const imgRes = await fetch(highResUrl);
                        item.customCoverBuffer = await imgRes.arrayBuffer();
                        item.customCoverMime = imgRes.headers.get('content-type') || 'image/jpeg';
                    }

                    if (activeIndex === targetIdx) {
                        await selectQueueItem(targetIdx);
                    }
                    statusMsg.innerText = "✅ 온라인 음악 정보 및 새 커버를 가져왔습니다!";
                } else {
                    statusMsg.innerText = "검색 결과를 찾지 못했습니다. 기존 커버가 유지됩니다.";
                }
            } catch (err) {
                statusMsg.innerText = "정보 검색 중 오류가 발생했습니다.";
            }
        }

        function extractPureAudio(buffer) {
            let bytes = new Uint8Array(buffer);
            let start = 0;
            let end = bytes.length;

            if (bytes.length > 10 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) {
                const flags = bytes[5];
                const hasFooter = (flags & 0x10) !== 0;
                const size = ((bytes[6] & 0x7F) << 21) | ((bytes[7] & 0x7F) << 14) | ((bytes[8] & 0x7F) << 7) | (bytes[9] & 0x7F);
                start = 10 + size + (hasFooter ? 10 : 0);
            }

            if (end - start > 128) {
                if (bytes[end - 128] === 0x54 && bytes[end - 127] === 0x41 && bytes[end - 126] === 0x47) {
                    end -= 128;
                }
            }

            if (end - start > 32) {
                if (bytes[end - 32] === 0x41 && bytes[end - 31] === 0x50 && bytes[end - 30] === 0x45 && bytes[end - 29] === 0x54) {
                    end -= 32;
                }
            }

            return buffer.slice(start, end);
        }

        function audioBufferToMp3(audioBuffer) {
            const channels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
            const mp3Data = [];

            const left = audioBuffer.getChannelData(0);
            const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

            const sampleBlockSize = 1152;
            const leftChunk = new Int16Array(sampleBlockSize);
            const rightChunk = new Int16Array(sampleBlockSize);

            for (let i = 0; i < left.length; i += sampleBlockSize) {
                const subLen = Math.min(sampleBlockSize, left.length - i);
                for (let j = 0; j < subLen; j++) {
                    let sL = Math.max(-1, Math.min(1, left[i + j]));
                    leftChunk[j] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;

                    let sR = Math.max(-1, Math.min(1, right[i + j]));
                    rightChunk[j] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
                }
                
                let mp3buf;
                if (channels === 1) {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk.subarray(0, subLen));
                } else {
                    mp3buf = mp3encoder.encodeBuffer(leftChunk.subarray(0, subLen), rightChunk.subarray(0, subLen));
                }
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);

            let totalLen = 0;
            for (let i = 0; i < mp3Data.length; i++) {
                totalLen += mp3Data[i].length;
            }
            const merged = new Uint8Array(totalLen);
            let offset = 0;
            for (let i = 0; i < mp3Data.length; i++) {
                merged.set(mp3Data[i], offset);
                offset += mp3Data[i].length;
            }
            return merged.buffer;
        }

        // 1곡만 독립 스코프에서 변환·반복 후 Blob만 반환 (함수 종료 즉시 내부 버퍼 GC 회수)
        async function buildSingleRepeatedMp3(item, repeatCount, stepIndex, totalSteps, usedNames) {
            const meta = await readSingleFileMetadata(item.file);

            const finalTitle = (item.edited ? item.title : (meta.title || item.title)).trim() || 'music';
            const finalArtist = (item.edited ? item.artist : (meta.artist || item.artist)).trim();
            const finalComposer = (item.edited ? item.composer : (meta.composer || item.composer)).trim();
            const coverBuffer = item.customCoverBuffer || meta.coverBuffer;
            const coverMimeType = item.customCoverBuffer ? item.customCoverMime : meta.coverMimeType;

            // 목록 제목도 실제 태그 제목으로 업데이트
            const queueIdx = fileQueue.indexOf(item);
            if (queueIdx >= 0) {
                const titleEl = document.getElementById(`q-title-${queueIdx}`);
                if (titleEl) titleEl.textContent = `${queueIdx + 1}. ${finalTitle}`;
            }

            let rawBuffer = await item.file.arrayBuffer();
            let baseAudioBuffer;

            if (isMp4(rawBuffer)) {
                statusMsg.innerText = `[${stepIndex + 1}/${totalSteps}] "${finalTitle}" M4A → MP3 변환 중...`;
                await sleep(30);
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const decodedBuffer = await audioCtx.decodeAudioData(rawBuffer.slice(0));
                baseAudioBuffer = audioBufferToMp3(decodedBuffer);
                await audioCtx.close();
            } else {
                baseAudioBuffer = extractPureAudio(rawBuffer);
            }
            rawBuffer = null;

            statusMsg.innerText = `[${stepIndex + 1}/${totalSteps}] "${finalTitle}" ${repeatCount}회 반복 생성 중...`;
            await sleep(30);

            const sourceArray = new Uint8Array(baseAudioBuffer);
            const finalArray = new Uint8Array(baseAudioBuffer.byteLength * repeatCount);
            for (let i = 0; i < repeatCount; i++) {
                finalArray.set(sourceArray, i * baseAudioBuffer.byteLength);
            }
            baseAudioBuffer = null;

            const writer = new ID3Writer(finalArray.buffer);
            if (finalTitle) writer.setFrame('TIT2', finalTitle);
            if (finalArtist) writer.setFrame('TPE1', [finalArtist]);
            if (finalComposer) writer.setFrame('TCOM', [finalComposer]);

            if (coverBuffer) {
                writer.setFrame('APIC', {
                    type: 3,
                    data: coverBuffer,
                    description: 'Cover',
                    mime: coverMimeType
                });
            }

            writer.addTag();
            const resultBlob = writer.getBlob();

            // 중복 파일명 방지
            const baseFileName = sanitizeFileName(finalTitle);
            let outputFileName = `${baseFileName}.mp3`;
            let counter = 2;
            while (usedNames.has(outputFileName.toLowerCase())) {
                outputFileName = `${baseFileName} (${counter}).mp3`;
                counter++;
            }
            usedNames.add(outputFileName.toLowerCase());

            return { blob: resultBlob, fileName: outputFileName };
        }

        async function runBatch(targetIndices) {
            if (!targetIndices.length || isProcessing) return;

            isProcessing = true;
            stopRequested = false;
            downloadBtn.disabled = true;
            searchBtn.disabled = true;
            fileInput.disabled = true;
            batchModeSelect.disabled = true;
            repeatCountSelect.disabled = true;
            retryBtn.style.display = 'none';

            if (targetIndices.length > 1) {
                stopBtn.style.display = 'block';
                progressContainer.style.display = 'block';
            }

            await requestScreenWakeLock();

            const repeatCount = parseInt(repeatCountSelect.value, 10);
            const mode = fileQueue.length === 1 ? 'single' : batchModeSelect.value;
            const zipChunkSize = mode === 'zip10' ? 10 : (mode === 'zip20' ? 20 : 0);

            const total = targetIndices.length;
            const usedNames = new Set();
            let successCount = 0;
            let failCount = 0;

            let currentZip = zipChunkSize > 0 ? new JSZip() : null;
            let itemsInCurrentZip = 0;
            let zipPartNumber = 1;
            let chunkStartNumber = 1;

            updateProgressUI(0, total);

            for (let step = 0; step < total; step++) {
                if (stopRequested) {
                    statusMsg.innerText = `⏹️ 사용자 요청으로 작업이 중단되었습니다. (완료: ${successCount}곡)`;
                    break;
                }

                const idx = targetIndices[step];
                const item = fileQueue[idx];
                updateItemStatusUI(idx, '⏳ 처리중', true);

                try {
                    let result = await buildSingleRepeatedMp3(item, repeatCount, step, total, usedNames);

                    if (zipChunkSize > 0) {
                        // 무압축(STORE) 방식으로 ZIP에 담아 CPU와 메모리 소모 최소화
                        currentZip.file(result.fileName, result.blob, { compression: 'STORE' });
                        result.blob = null; // 개별 Blob 참조 즉시 해제
                        result = null;
                        itemsInCurrentZip++;

                        const isLastItem = (step === total - 1);
                        if (itemsInCurrentZip >= zipChunkSize || isLastItem) {
                            const chunkEndNumber = chunkStartNumber + itemsInCurrentZip - 1;
                            statusMsg.innerText = `📦 Part ${zipPartNumber} (${chunkStartNumber}~${chunkEndNumber}번 곡) ZIP 저장 및 메모리 비우는 중...`;
                            await sleep(100);

                            const zipBlob = await currentZip.generateAsync({
                                type: 'blob',
                                compression: 'STORE'
                            });

                            triggerBrowserDownload(zipBlob, `반복음원_Part${zipPartNumber}_${chunkStartNumber}-${chunkEndNumber}번.zip`);

                            // ZIP 객체 및 버퍼 완전히 초기화하여 램 회수
                            currentZip = isLastItem ? null : new JSZip();
                            itemsInCurrentZip = 0;
                            zipPartNumber++;
                            chunkStartNumber = chunkEndNumber + 1;

                            // 가비지 컬렉션(메모리 정리)을 위한 짧은 휴식
                            await sleep(1200);
                        }
                    } else {
                        // 1곡씩 즉시 저장 후 메모리 비우기
                        triggerBrowserDownload(result.blob, result.fileName);
                        result.blob = null;
                        result = null;
                        if (step < total - 1) {
                            await sleep(1200);
                        }
                    }

                    updateItemStatusUI(idx, '✅ 완료', false);
                    successCount++;
                } catch (err) {
                    console.error(err);
                    updateItemStatusUI(idx, '❌ 실패', false);
                    failCount++;
                }

                updateProgressUI(step + 1, total);
            }

            // 중단되었는데 ZIP 안에 남은 곡이 있으면 마저 다운로드
            if (stopRequested && currentZip && itemsInCurrentZip > 0) {
                try {
                    const zipBlob = await currentZip.generateAsync({ type: 'blob', compression: 'STORE' });
                    triggerBrowserDownload(zipBlob, `반복음원_중단전_${itemsInCurrentZip}곡.zip`);
                } catch (e) {}
                currentZip = null;
            }

            await releaseScreenWakeLock();

            isProcessing = false;
            downloadBtn.disabled = false;
            searchBtn.disabled = false;
            fileInput.disabled = false;
            batchModeSelect.disabled = false;
            repeatCountSelect.disabled = false;
            stopBtn.style.display = 'none';

            if (failCount > 0) {
                retryBtn.style.display = 'block';
                retryBtn.innerText = `🔄 실패한 곡만 다시 실행 (${failCount}곡)`;
            }

            if (!stopRequested) {
                if (total === 1 && successCount === 1) {
                    statusMsg.innerText = "🎉 다운로드가 완료되었습니다!";
                } else {
                    statusMsg.innerText = `🎉 전체 작업 완료! (성공: ${successCount}곡 / 실패: ${failCount}곡)\n분할 저장된 ZIP 파일은 내 파일 앱에서 압축을 풀어주세요.`;
                }
            }
        }

        downloadBtn.addEventListener('click', () => {
            const allIndices = fileQueue.map((_, idx) => idx);
            runBatch(allIndices);
        });

        retryBtn.addEventListener('click', () => {
            const failedIndices = fileQueue
                .map((item, idx) => (item.status === '❌ 실패' ? idx : -1))
                .filter(idx => idx !== -1);
            runBatch(failedIndices);
        });

        stopBtn.addEventListener('click', () => {
            if (isProcessing) {
                stopRequested = true;
                stopBtn.disabled = true;
                stopBtn.innerText = "⏳ 현재 곡 마무리 후 중단 중...";
            }
        });
    </script>
