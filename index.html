<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 태그 & 커버 에디터</title>
    <!-- ID3 태그 입히기 라이브러리 (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }
        .cover-box {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-placeholder {
            font-size: 48px;
            color: #555;
        }
        .file-label {
            display: inline-block;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .file-label:hover {
            background-color: #1ed760;
        }
        input[type="file"] {
            display: none;
        }
        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .input-group label {
            font-size: 0.8em;
            color: #b3b3b3;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            font-size: 0.9em;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.2s;
        }
        .btn-search {
            background-color: #333;
            color: #fff;
        }
        .btn-search:hover {
            background-color: #444;
        }
        .btn-download {
            background-color: #1db954;
            color: #000;
        }
        .btn-download:hover {
            background-color: #1ed760;
        }
        .btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        #status-msg {
            font-size: 0.8em;
            color: #1db954;
            margin-top: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>🎵 MP3 태그 에디터</h2>

        <!-- 파일 선택 버튼 -->
        <label class="file-label" for="audio-file">
            📂 MP3 파일 선택하기
        </label>
        <input type="file" id="audio-file" accept="audio/mp3, audio/mpeg">

        <!-- 앨범 커버 프리뷰 -->
        <div class="cover-box">
            <span class="cover-placeholder" id="placeholder">🎵</span>
            <img id="cover-img" src="" alt="Album Cover" style="display: none;">
        </div>

        <!-- 메타데이터 수정 영역 -->
        <div class="input-group">
            <label>곡 제목 (Title)</label>
            <input type="text" id="title-input" placeholder="노래 제목 입력">
        </div>
        <div class="input-group">
            <label>아티스트 (Artist)</label>
            <input type="text" id="artist-input" placeholder="가수 이름 입력">
        </div>
        <div class="input-group">
            <label>작곡가 / 프로듀서 (Composer)</label>
            <input type="text" id="composer-input" placeholder="작곡가 이름 입력">
        </div>
        <div class="input-group">
            <label>앨범명 (Album)</label>
            <input type="text" id="album-input" placeholder="앨범명 입력">
        </div>

        <!-- 버튼 영역 -->
        <div class="btn-group">
            <button class="btn btn-search" id="search-btn">🔍 정보 자동 검색</button>
            <button class="btn btn-download" id="download-btn" disabled>💾 태그 입혀서 저장</button>
        </div>

        <div id="status-msg"></div>

        <!-- 미리듣기 오디오 -->
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        let rawFileBuffer = null;
        let coverBuffer = null;
        let coverMimeType = 'image/jpeg';

        const fileInput = document.getElementById('audio-file');
        const audioPlayer = document.getElementById('audio-player');
        const titleInput = document.getElementById('title-input');
        const artistInput = document.getElementById('artist-input');
        const composerInput = document.getElementById('composer-input');
        const albumInput = document.getElementById('album-input');
        const coverImg = document.getElementById('cover-img');
        const placeholder = document.getElementById('placeholder');
        const searchBtn = document.getElementById('search-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusMsg = document.getElementById('status-msg');

        // 1. 파일 올렸을 때 이벤트
        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusMsg.innerText = "파일을 불러오는 중...";
            
            // 재생용 URL 연결
            audioPlayer.src = URL.createObjectURL(file);
            
            // 파일 원본 바이너리(ArrayBuffer) 읽기
            rawFileBuffer = await file.arrayBuffer();

            // 파일명에서 기본 곡 제목 추출
            const fileName = file.name.replace(/\.[^/.]+$/, "");
            titleInput.value = fileName;

            // 검색 실행
            fetchMetadata(fileName);
            downloadBtn.disabled = false;
        });

        // 2. iTunes API 정보 자동 검색
        searchBtn.addEventListener('click', () => {
            const query = titleInput.value.trim();
            if (query) fetchMetadata(query);
        });

        async function fetchMetadata(query) {
            statusMsg.innerText = "음악 정보를 검색 중입니다...";
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const info = data.results[0];

                    titleInput.value = info.trackName || '';
                    artistInput.value = info.artistName || '';
                    composerInput.value = info.artistName || ''; // 기본값으로 아티스트명 설정
                    albumInput.value = info.collectionName || '';

                    // 고화질 커버 이미지 URL (600x600)
                    if (info.artworkUrl100) {
                        const highResUrl = info.artworkUrl100.replace('100x100bb', '600x600bb');
                        coverImg.src = highResUrl;
                        coverImg.style.display = 'block';
                        placeholder.style.display = 'none';

                        // 이미지 다운로드 후 ArrayBuffer로 변환
                        const imgRes = await fetch(highResUrl);
                        coverBuffer = await imgRes.arrayBuffer();
                        coverMimeType = imgRes.headers.get('content-type') || 'image/jpeg';
                    }
                    statusMsg.innerText = "✅ 음악 정보 및 커버를 가져왔습니다!";
                } else {
                    statusMsg.innerText = "검색 결과를 찾지 못했습니다. 직접 입력해 주세요.";
                }
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "정보 검색 중 오류가 발생했습니다.";
            }
        }

        // 3. ID3 태그 입혀서 새 MP3 파일 다운로드
        downloadBtn.addEventListener('click', () => {
            if (!rawFileBuffer) {
                alert("MP3 파일을먼저 선택해 주세요!");
                return;
            }

            try {
                statusMsg.innerText = "태그를 입히는 중...";
                const writer = new ID3Writer(rawFileBuffer);

                // 텍스트 태그 설정
                if (titleInput.value.trim()) writer.setFrame('TIT2', titleInput.value.trim());
                if (artistInput.value.trim()) writer.setFrame('TPE1', [artistInput.value.trim()]);
                if (composerInput.value.trim()) writer.setFrame('TCOM', [composerInput.value.trim()]);
                if (albumInput.value.trim()) writer.setFrame('TALB', albumInput.value.trim());

                // 앨범 커버 이미지 태그(APIC) 설정
                if (coverBuffer) {
                    writer.setFrame('APIC', {
                        type: 3, // Cover (front)
                        data: coverBuffer,
                        description: 'Cover',
                        mime: coverMimeType
                    });
                }

                writer.addTag();

                // 새로 만들어진 파일 다운로드 실행
                const blob = writer.getBlob();
                const downloadUrl = writer.getURL();
                
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `[태그수정] ${titleInput.value.trim() || 'music'}.mp3`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                statusMsg.innerText = "🎉 다운로드가 완료되었습니다!";
            } catch (err) {
                console.error(err);
                alert("태그를 입히는 과정에서 오류가 발생했습니다.");
                statusMsg.innerText = "태그 합성 실패";
            }
        });
    </script>

</body>
</html>
