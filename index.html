<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 태그 & 반복 에디터</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }
        .cover-box {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-placeholder {
            font-size: 48px;
            color: #555;
        }
        .file-label {
            display: inline-block;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .file-label:hover {
            background-color: #1ed760;
        }
        input[type="file"] {
            display: none;
        }
        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .input-group label {
            font-size: 0.8em;
            color: #b3b3b3;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            font-size: 0.9em;
        }
        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .toggle-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-btn.active {
            background-color: #1db954;
            color: #000;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.2s;
        }
        .btn-search {
            background-color: #333;
            color: #fff;
        }
        .btn-search:hover {
            background-color: #444;
        }
        .btn-download {
            background-color: #1db954;
            color: #000;
        }
        .btn-download:hover {
            background-color: #1ed760;
        }
        .btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        #status-msg {
            font-size: 0.8em;
            color: #1db954;
            margin-top: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>🎵 MP3 태그 & 반복 에디터</h2>

        <label class="file-label" for="audio-file">
            📂 MP3 파일 선택하기
        </label>
        <input type="file" id="audio-file" accept="audio/mp3, audio/mpeg">

        <div class="cover-box">
            <span class="cover-placeholder" id="placeholder">🎵</span>
            <img id="cover-img" src="" alt="Album Cover" style="display: none;">
        </div>

        <div class="input-group">
            <label>곡 제목 (Title)</label>
            <input type="text" id="title-input" placeholder="노래 제목 입력">
        </div>
        <div class="input-group">
            <label>아티스트 (Artist)</label>
            <input type="text" id="artist-input" placeholder="가수 이름 입력">
        </div>
        <div class="input-group">
            <label>작곡가 / 프로듀서 (Composer)</label>
            <input type="text" id="composer-input" placeholder="작곡가 이름 입력">
        </div>

        <div class="option-row">
            <span>🔁 무한 반복 재생 (웹용)</span>
            <button class="toggle-btn" id="loop-toggle-btn">OFF</button>
        </div>

        <div class="input-group">
            <label>🔁 음원 반복해서 저장하기</label>
            <select id="repeat-count-select">
                <option value="1">1회 (원본 길이)</option>
                <option value="2">2회 반복 연결</option>
                <option value="3">3회 반복 연결</option>
                <option value="4">4회 반복 연결</option>
                <option value="5">5회 반복 연결</option>
                <option value="6">6회 반복 연결</option>
                <option value="7">7회 반복 연결</option>
                <option value="8">8회 반복 연결</option>
                <option value="9">9회 반복 연결</option>
                <option value="10">10회 반복 연결</option>
                <option value="12">12회 반복 연결</option>
                <option value="15">15회 반복 연결</option>
                <option value="18">18회 반복 연결</option>
                <option value="20">20회 반복 연결 (최대)</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn btn-search" id="search-btn">🔍 정보 자동 검색</button>
            <button class="btn btn-download" id="download-btn" disabled>💾 태그 입혀서 저장</button>
        </div>

        <div id="status-msg"></div>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        let rawFileBuffer = null;
        let coverBuffer = null;
        let coverMimeType = 'image/jpeg';

        const fileInput = document.getElementById('audio-file');
        const audioPlayer = document.getElementById('audio-player');
        const titleInput = document.getElementById('title-input');
        const artistInput = document.getElementById('artist-input');
        const composerInput = document.getElementById('composer-input');
        const coverImg = document.getElementById('cover-img');
        const placeholder = document.getElementById('placeholder');
        const searchBtn = document.getElementById('search-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusMsg = document.getElementById('status-msg');
        const loopToggleBtn = document.getElementById('loop-toggle-btn');
        const repeatCountSelect = document.getElementById('repeat-count-select');

        loopToggleBtn.addEventListener('click', () => {
            audioPlayer.loop = !audioPlayer.loop;
            if (audioPlayer.loop) {
                loopToggleBtn.innerText = 'ON';
                loopToggleBtn.classList.add('active');
            } else {
                loopToggleBtn.innerText = 'OFF';
                loopToggleBtn.classList.remove('active');
            }
        });

        // 가짜 MP3(M4A/MP4) 식별 함수
        function isMp4(buffer) {
            const bytes = new Uint8Array(buffer);
            if (bytes.length > 8) {
                if (bytes[4] === 0x66 && bytes[5] === 0x74 && bytes[6] === 0x79 && bytes[7] === 0x70) {
                    return true;
                }
            }
            return false;
        }

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusMsg.innerText = "파일에서 커버 및 태그 추출 중...";
            audioPlayer.src = URL.createObjectURL(file);
            rawFileBuffer = await file.arrayBuffer();

            const fileName = file.name.replace(/\.[^/.]+$/, "");
            titleInput.value = fileName;
            artistInput.value = '';
            composerInput.value = '';
            coverBuffer = null;
            coverImg.style.display = 'none';
            placeholder.style.display = 'block';

            window.jsmediatags.read(file, {
                onSuccess: function(tag) {
                    const tags = tag.tags;
                    if (tags.title) titleInput.value = tags.title;
                    if (tags.artist) artistInput.value = tags.artist;
                    if (tags.composer) composerInput.value = tags.composer;

                    if (tags.picture) {
                        const { data, format } = tags.picture;
                        const byteArray = new Uint8Array(data);
                        coverBuffer = byteArray.buffer;
                        coverMimeType = format || 'image/jpeg';
                        const blob = new Blob([byteArray], { type: coverMimeType });
                        coverImg.src = URL.createObjectURL(blob);
                        coverImg.style.display = 'block';
                        placeholder.style.display = 'none';
                        statusMsg.innerText = "✅ 기존 커버 및 태그 정보를 불러왔습니다!";
                    } else {
                        statusMsg.innerText = "기존 커버가 없어 검색 버튼으로 찾으실 수 있습니다.";
                    }
                },
                onError: function(error) {
                    statusMsg.innerText = "파일을 불러왔습니다.";
                }
            });

            downloadBtn.disabled = false;
        });

        searchBtn.addEventListener('click', () => {
            const query = titleInput.value.trim();
            if (query) fetchMetadata(query);
        });

        async function fetchMetadata(query) {
            statusMsg.innerText = "음악 정보를 온라인 검색 중입니다...";
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const info = data.results[0];
                    titleInput.value = info.trackName || '';
                    artistInput.value = info.artistName || '';
                    composerInput.value = info.artistName || '';

                    if (info.artworkUrl100) {
                        const highResUrl = info.artworkUrl100.replace('100x100bb', '600x600bb');
                        coverImg.src = highResUrl;
                        coverImg.style.display = 'block';
                        placeholder.style.display = 'none';
                        const imgRes = await fetch(highResUrl);
                        coverBuffer = await imgRes.arrayBuffer();
                        coverMimeType = imgRes.headers.get('content-type') || 'image/jpeg';
                    }
                    statusMsg.innerText = "✅ 온라인 음악 정보 및 새 커버를 가져왔습니다!";
                } else {
                    statusMsg.innerText = "검색 결과를 찾지 못했습니다. 기존 커버가 유지됩니다.";
                }
            } catch (err) {
                statusMsg.innerText = "정보 검색 중 오류가 발생했습니다.";
            }
        }

        // 음원 앞뒤의 불순물(기존 태그)을 완벽하게 제거하여 순수 MP3 데이터만 추출
        function extractPureAudio(buffer) {
            let bytes = new Uint8Array(buffer);
            let start = 0;
            let end = bytes.length;

            // 1. 맨 앞부분 ID3v2 태그 제거
            if (bytes.length > 10 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) {
                const flags = bytes[5];
                const hasFooter = (flags & 0x10) !== 0;
                const size = ((bytes[6] & 0x7F) << 21) | ((bytes[7] & 0x7F) << 14) | ((bytes[8] & 0x7F) << 7) | (bytes[9] & 0x7F);
                start = 10 + size + (hasFooter ? 10 : 0);
            }

            // 2. 맨 뒷부분 ID3v1 태그 제거 (정확히 128바이트)
            if (end - start > 128) {
                if (bytes[end - 128] === 0x54 && bytes[end - 127] === 0x41 && bytes[end - 126] === 0x47) {
                    end -= 128;
                }
            }

            // 3. 맨 뒷부분 APEv2 태그 제거 (32바이트)
            if (end - start > 32) {
                if (bytes[end - 32] === 0x41 && bytes[end - 31] === 0x50 && bytes[end - 30] === 0x45 && bytes[end - 29] === 0x54) {
                    end -= 32;
                }
            }

            return buffer.slice(start, end);
        }

        function repeatArrayBuffer(buffer, count) {
            const pureAudioBuffer = extractPureAudio(buffer);
            if (count <= 1) return pureAudioBuffer;
            
            const sourceArray = new Uint8Array(pureAudioBuffer);
            const resultArray = new Uint8Array(pureAudioBuffer.byteLength * count);
            for (let i = 0; i < count; i++) {
                resultArray.set(sourceArray, i * pureAudioBuffer.byteLength);
            }
            return resultArray.buffer;
        }

        downloadBtn.addEventListener('click', () => {
            if (!rawFileBuffer) {
                alert("MP3 파일을 먼저 선택해 주세요!");
                return;
            }

            // 유튜브 음원 추출기에서 흔히 발생하는 가짜 MP3(m4a) 방어
            if (isMp4(rawFileBuffer)) {
                alert("⚠️ 오류: 이 파일은 이름만 .mp3이고 실제로는 m4a(mp4) 형식입니다.\n\n유튜브 음원 추출 사이트에서 받은 파일에서 흔히 발생합니다. 이 파일은 구조가 달라서 반복 연결이 불가능합니다.\n진짜 mp3 파일로 변환하신 후 다시 시도해 주세요.");
                statusMsg.innerText = "형식이 맞지 않는 가짜 MP3 파일입니다.";
                return;
            }

            try {
                const repeatCount = parseInt(repeatCountSelect.value, 10);
                statusMsg.innerText = `${repeatCount}회 반복 음원 생성 및 태그 처리 중...`;

                setTimeout(() => {
                    const finalAudioBuffer = repeatArrayBuffer(rawFileBuffer, repeatCount);
                    const writer = new ID3Writer(finalAudioBuffer);

                    if (titleInput.value.trim()) writer.setFrame('TIT2', titleInput.value.trim());
                    if (artistInput.value.trim()) writer.setFrame('TPE1', [artistInput.value.trim()]);
                    if (composerInput.value.trim()) writer.setFrame('TCOM', [composerInput.value.trim()]);

                    if (coverBuffer) {
                        writer.setFrame('APIC', {
                            type: 3,
                            data: coverBuffer,
                            description: 'Cover',
                            mime: coverMimeType
                        });
                    }

                    writer.addTag();

                    const downloadUrl = writer.getURL();
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    
                    // 태그 없이 곡 제목만 깔끔하게 나오도록 유지
                    a.download = `${titleInput.value.trim() || 'music'}.mp3`;
                    
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    statusMsg.innerText = "🎉 다운로드가 완료되었습니다!";
                }, 100);
            } catch (err) {
                console.error(err);
                alert("처리 과정에서 오류가 발생했습니다.");
                statusMsg.innerText = "다운로드 실패";
            }
        });
    </script>

</body>
</html>
